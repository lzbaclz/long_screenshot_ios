name: ScrollCapture
options:
  minimumXcodeGenVersion: 2.44.0
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  groupSortPosition: top
  developmentLanguage: zh-Hans
configs:
  Debug: debug
  Release: release
configFiles:
  Debug: Config/Project.xcconfig
  Release: Config/Project.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  ScrollCaptureCore:
    path: .
targets:
  ScrollCapture:
    type: application
    platform: iOS
    sources:
      - path: iOS/App
        excludes: ["**/*.md"]
      - path: iOS/Shared
        excludes: ["**/*.md"]
      - path: iOS/Resources
      - path: iOS/Experimental
        optional: true
      - path: Config/PrivacyInfo.xcprivacy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.lzbaclz.longscreenshot
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    info:
      path: Config/App-Info.plist
      properties:
        CFBundleDisplayName: Longlet
        CFBundleName: ScrollCapture
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        UIRequiresFullScreen: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSPhotoLibraryAddUsageDescription: 将你制作的长截图保存到相册。
        SharedAppGroupIdentifier: $(APP_GROUP_IDENTIFIER)
        BroadcastExtensionIdentifier: dev.lzbaclz.longscreenshot.BroadcastExtension
        ProProductIdentifier: dev.lzbaclz.longscreenshot.pro
    entitlements:
      path: Config/App.entitlements
      properties:
        com.apple.security.application-groups: [$(APP_GROUP_IDENTIFIER)]
    dependencies:
      - package: ScrollCaptureCore
      - target: BroadcastExtension
        embed: true
  BroadcastExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: iOS/BroadcastExtension
        excludes: ["**/*.md"]
      - path: iOS/Shared
        excludes: ["**/*.md"]
      - path: Config/PrivacyInfo.xcprivacy
      - path: iOS/App/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.lzbaclz.longscreenshot.BroadcastExtension
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    info:
      path: Config/Broadcast-Info.plist
      properties:
        CFBundleDisplayName: Longlet
        SharedAppGroupIdentifier: $(APP_GROUP_IDENTIFIER)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.broadcast-services-upload
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SampleHandler
          RPBroadcastProcessMode: RPBroadcastProcessModeSampleBuffer
    entitlements:
      path: Config/Broadcast.entitlements
      properties:
        com.apple.security.application-groups: [$(APP_GROUP_IDENTIFIER)]
    dependencies:
      - package: ScrollCaptureCore
  ScrollCaptureTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: iOS/SharedTests
        optional: true
      - path: iOS/AppTests
        optional: true
      - path: iOS/IntegrationTests
        optional: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.lzbaclz.longscreenshot.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: ScrollCapture
      - package: ScrollCaptureCore
  ScrollCaptureUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: iOS/AppUITests
        optional: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.lzbaclz.longscreenshot.uitests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: ScrollCapture
  FixtureReader:
    type: application
    platform: iOS
    sources:
      - path: iOS/FixtureReader
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.lzbaclz.longscreenshot.fixtures
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: 截图测试页
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIRequiresFullScreen: YES
  ScrollCaptureDeviceTests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: iOS/DeviceUITests
        optional: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.lzbaclz.longscreenshot.devicetests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: ScrollCapture
schemes:
  ScrollCapture:
    build:
      targets:
        ScrollCapture: all
        ScrollCaptureTests: [test]
        ScrollCaptureUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - name: ScrollCaptureTests
        - name: ScrollCaptureUITests
    archive:
      config: Release
  FixtureReader:
    build:
      targets:
        FixtureReader: all
    run:
      config: Debug
  ScrollCaptureDevice:
    build:
      targets:
        ScrollCapture: all
        FixtureReader: all
        ScrollCaptureDeviceTests: [test]
    test:
      config: Debug
      targets:
        - name: ScrollCaptureDeviceTests
